<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2048 Game</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="game-container">
		<h1>2048</h1>
		<div class="score-container">
		<span>Score: <span id="score">0</span></span>
		<button id="restart-btn">Restart</button>
		</div>
		<div class="grid-container">
			<div class="grid-row">
				<div class="grid-cell" id="cell-0-0"></div>
				<div class="grid-cell" id="cell-0-1"></div>
				<div class="grid-cell" id="cell-0-2"></div>
				<div class="grid-cell" id="cell-0-3"></div>
			</div>
			<div class="grid-row">
				<div class="grid-cell" id="cell-1-0"></div>
				<div class="grid-cell" id="cell-1-1"></div>
				<div class="grid-cell" id="cell-1-2"></div>
				<div class="grid-cell" id="cell-1-3"></div>
			</div>
			<div class="grid-row">
				<div class="grid-cell" id="cell-2-0"></div>
				<div class="grid-cell" id="cell-2-1"></div>
				<div class="grid-cell" id="cell-2-2"></div>
				<div class="grid-cell" id="cell-2-3"></div>
			</div>
			<div class="grid-row">
				<div class="grid-cell" id="cell-3-0"></div>
				<div class="grid-cell" id="cell-3-1"></div>
				<div class="grid-cell" id="cell-3-2"></div>
				<div class="grid-cell" id="cell-3-3"></div>
			</div>
		</div>
		
		<div class="cheat-buttons">
			<button id="random-moves-btn" class="cheat-btn">10 Random Moves</button>
			<button id="fill-gaps-btn" class="cheat-btn">Fill Gaps</button>
			<button id="duplicate-tiles-btn" class="cheat-btn">Duplicate Tiles</button>
			<button id="randomize-tiles-btn" class="cheat-btn">Randomize Tiles</button>
		</div>
	</div>
	
	<!-- Game Over/Win Modal -->
	<div id="game-message" class="game-message hidden">
		<div class="message-content">
			<h2 id="message-title"></h2>
			<p id="message-text"></p>
			<button id="continue-btn" class="message-btn">Continue</button>
			<button id="restart-message-btn" class="message-btn">Restart</button>
		</div>
	</div>
	
	<script src="script.js"></script>
</body>
</html>
